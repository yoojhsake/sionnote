# 분류 페이지(Category)에서 글을 묶는 순서. 글 머리말의 phase / area 값과 글자가 같아야 한다.
# 작업 글: phase 순서대로, 같은 phase 안에서는 seq 순서(작업 진행 순서)로 보여 준다.
phases:
  - "준비"
  - "구조 이해 실습"
  - "운영 설정 실측"
# 트러블슈팅 글: area 순서대로, 같은 area 안에서는 seq 순서로 보여 준다.
areas:
  - "로그인·권한"
  - "Teams·채널·파일"
  - "라이선스·그룹"
  - "Graph·Cloud Shell·스크립트"
  - "보고서·감사·청구"
