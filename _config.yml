# Sion's History — Jekyll + Minimal Mistakes (GitHub Pages remote theme)
# 테마를 릴리스 태그로 고정(마스터 최신본을 자동으로 받아 오지 않도록)
remote_theme: mmistakes/minimal-mistakes@4.28.0
minimal_mistakes_skin: default   # air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise 중 선택 가능

title: "Sion's History"
title_separator: "-"
subtitle: "기록하고, 검증하고, 남긴다"
name: "Sion's History"
description: "M365·Azure·Identity 운영 실습과 검증 기록"
locale: ko-KR
# 저장소 이름이 <아이디>.github.io 가 아니라서 하위 경로(/sionnote)로 열린다.
# 저장소를 yoojhsake.github.io 로 바꾸면 baseurl 을 "" 로 되돌린다.
url: "https://yoojhsake.github.io"
baseurl: "/sionnote"

# RSS/Atom 피드(feed.xml)는 만들지 않고 하단·머리말의 Feed 링크도 숨김
atom_feed:
  hide: true

search: true
search_full_content: true
words_per_minute: 200
timezone: Asia/Seoul

author:
  name: "Sion's History"
  avatar: "/assets/images/profile.png"
  bio: "AD·인증·PKI 운영 경험을 M365·Azure 클라우드 운영으로 확장하며 실습과 검증을 기록합니다."
  location: "South Korea"
# 작성자 소개와 하단에 GitHub 등 외부 링크를 두지 않는다(links·footer 항목 없음).

# 글 목록
paginate: 10
paginate_path: /page:num/

include: ["_pages"]
exclude: ["_private", "raw", ".gitignore", "tools", "README.md", "Gemfile", "Gemfile.lock", "node_modules", "vendor"]

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-remote-theme

permalink: /:categories/:title/
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: false
      related: true
      toc: true
      toc_sticky: true
      toc_label: "목차"
  - scope: { path: "_pages" }
    values:
      layout: single
      author_profile: true
