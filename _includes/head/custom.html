<!-- 브라우저 탭 아이콘과 홈 화면 아이콘: 프로필(토끼) 이미지 -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- 본문 그림을 누르면 원본 크기로 새 탭에서 열린다(캡처 글자를 확대해서 볼 수 있게) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.page__content img').forEach(function (img) {
    var n = img.nextElementSibling;
    if (n && n.tagName === 'EM') n.className = 'figcap';
    if (img.closest('a')) return;
    var a = document.createElement('a'); a.className = 'figlink';
    a.href = img.currentSrc || img.src; a.target = '_blank'; a.rel = 'noopener';
    a.title = '누르면 원본 크기로 열립니다';
    img.parentNode.insertBefore(a, img); a.appendChild(img);
  });
});
</script>

<!-- 제목 옆 링크(🔗) 아이콘을 누르면 그 위치의 전체 주소(#포함)를 클립보드에 복사하고 "링크 복사됨"을 잠깐 보여 준다 -->
<style>
.copy-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:6px;font-size:.8em;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.copy-toast.show{opacity:.92}
</style>
<script>
document.addEventListener('click', function (e) {
  var a = e.target.closest('.page__content .header-link');
  if (!a || !navigator.clipboard) return;
  var url = location.origin + location.pathname + a.getAttribute('href');
  navigator.clipboard.writeText(url).then(function () {
    var t = document.querySelector('.copy-toast');
    if (!t) { t = document.createElement('div'); t.className = 'copy-toast'; document.body.appendChild(t); }
    t.textContent = '링크 복사됨';
    t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1500);
  });
});
</script>

<script>
  /* 좁은 화면(휴대폰)에서는 사이드바 목차를 접힌 상태로 시작한다(sidebar-custom.html의 목차) */
  document.addEventListener('DOMContentLoaded', function () {
    var d = document.querySelector('.toc--sidebar .toc-fold');
    if (d && window.matchMedia('(max-width: 63.9375em)').matches) d.removeAttribute('open');
  });
</script>
